<!DOCTYPE html>
<html lang="{{ site.Language.Lang }}" class="theme-mode-light theme-style-{{ site.Params.pageStyle | default "card" }}">
<head>
  {{ partial "head.html" . }}
</head>
<body class="theme-style-{{ site.Params.pageStyle | default "card" }}">
  {{ partial "header.html" . }}
  <div class="sidebar-mask" id="sidebar-mask"></div>
  {{ block "main" . }}{{ end }}
  {{ partial "footer.html" . }}
  <button class="back-to-top" id="back-to-top" title="返回顶部" aria-label="返回顶部"></button>
  {{ partial "scripts.html" . }}
</body>
</html>
