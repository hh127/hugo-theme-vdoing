{{- /* 站内搜索: 读取 home 输出的 index.json, 纯前端过滤 */ -}}
<div class="search-box" id="search-box">
  <button class="search-toggle icon-button" id="search-toggle" title="搜索" aria-label="搜索">
    {{ partial "icon.html" "search" }}
  </button>
  <div class="search-panel" id="search-panel">
    <input type="text" id="search-input" class="search-input" placeholder="搜索文章标题或内容..." autocomplete="off">
    <ul class="search-results" id="search-results"></ul>
  </div>
</div>
