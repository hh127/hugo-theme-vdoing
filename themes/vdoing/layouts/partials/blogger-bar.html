{{- /* 博主信息卡 (原 BloggerBar.vue) */ -}}
{{- with site.Params.blogger }}
<aside class="blogger-wrapper card-box">
  <div class="avatar">
    <img src="{{ .avatar }}" alt="头像" title="我好看吗" loading="lazy"
         onerror="this.onerror=null;this.src='{{ "img/logo.png" | relURL }}'">
  </div>
  {{- with site.Params.social }}
  {{- if . }}
  <div class="icons">
    {{- $total := len . }}
    {{- range . }}
    <a href="{{ .link }}" title="{{ .title }}" class="iconfont {{ .iconClass }}" style="width: {{ div 100 $total }}%" target="_blank" rel="noopener"></a>
    {{- end }}
  </div>
  {{- end }}
  {{- end }}
  <div class="blogger">
    <span class="name">{{ .name }}</span>
    <span class="slogan">{{ .slogan }}</span>
  </div>
</aside>
{{- end }}
