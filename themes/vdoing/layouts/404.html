{{ define "main" }}
{{- /* 404 (原 layouts/404.vue): 大号 404 + 随机文案 + 返回首页 */ -}}
{{- $msgs := slice "这里什么都没有。" "我是谁？我在哪？" "这是一个Four-Oh-Four." "看来我们的链接坏掉了~" -}}
<div class="custom-page not-found-page">
  <div class="theme-vdoing-content">
    <span>404</span>
    <blockquote>{{ index (shuffle $msgs) 0 }}</blockquote>
    <a href="{{ "/" | relURL }}">返回首页</a>
  </div>
</div>
{{ end }}
