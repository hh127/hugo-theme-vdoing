{{ define "main" }}
{{ partial "sidebar.html" (dict "page" . "hasTree" false) }}
<div class="page-wrapper no-sidebar">
  <div class="page-content">
    <main class="article-wrapper">
      <div class="not-found card-box">
        <h1 class="not-found-code">404</h1>
        <p class="not-found-text">页面不存在，可能已被移除或者链接有误。</p>
        <a class="action-button" href="{{ "/" | relURL }}">返回首页</a>
      </div>
    </main>
  </div>
</div>
{{ end }}
